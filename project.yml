name: Tierton
options:
  bundleIdPrefix: de.wilsker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tierton:
    type: application
    platform: iOS
    sources:
      - path: Tierton
        excludes:
          - Resources/Media
      - path: Tierton/Resources/Media
        type: folder
        buildPhase: resources
      - path: Content/catalog.json
        buildPhase: resources
      - path: Content/facts.json
        buildPhase: resources
      - path: Content/media.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wilsker.tierton
        PRODUCT_NAME: Tierton
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tierton
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bei „Sag's laut!“ hört Tierton zu, welches Tier du sagst."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Tierton erkennt den Tiernamen, den du laut sagst. Wenn möglich passiert das direkt auf dem Gerät."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
