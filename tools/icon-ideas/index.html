<title>Tierton Icon-Ideen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: filter row, then a grid of icon cards (icon in iOS shape, name, direction, heart). Click opens a home-screen preview. */
:root {
  --bg: #EEF1EC;
  --surface: #FFFFFF;
  --ink: #1F2A22;
  --muted: #5E6B61;
  --line: #D9DFD5;
  --accent: #2E8B57;
  --accent-ink: #FFFFFF;
  --heart: #D2414F;
  --font-display: "Fredoka", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --surface: #1D241F; --ink: #E8EDE6; --muted: #9DAA9F; --line: #2D372F;
    --accent: #4DB27A; --accent-ink: #0D1A12; --heart: #F0707B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --surface: #1D241F; --ink: #E8EDE6; --muted: #9DAA9F; --line: #2D372F;
  --accent: #4DB27A; --accent-ink: #0D1A12; --heart: #F0707B; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); line-height: 1.5; max-width: 64ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.f { font: inherit; font-weight: 700; font-size: .9rem; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.f[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.f:focus-visible, .heart:focus-visible, .ico:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.status { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0; }
.ico { width: 100%; max-width: 132px; aspect-ratio: 1; border-radius: 22.4%; overflow: hidden; box-shadow: 0 2px 8px rgb(0 0 0 / .18); border: 0; padding: 0; background: none; cursor: zoom-in; display: block; }
.ico svg { width: 100%; height: 100%; display: block; }
.meta { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.meta b { font-size: .92rem; line-height: 1.25; display: block; }
.meta small { color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .02em; }
.heart { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.heart svg { width: 18px; height: 18px; }
.heart[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); }
.heart[aria-pressed="true"] path { fill: currentColor; }
.notes { display: flex; flex-direction: column; gap: 6px; }
.notes label { font-weight: 700; }
.notes textarea { font: inherit; min-height: 70px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }

dialog { border: 0; border-radius: 26px; padding: 0; max-width: min(560px, calc(100vw - 32px)); width: 100%; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.pv { display: flex; flex-direction: column; gap: 16px; padding: 18px; }
.pv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pv-top h2 { font-family: var(--font-display); margin: 0; font-size: 1.3rem; }
.close { font: inherit; font-weight: 700; border-radius: 99px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.pv-big { width: min(260px, 70vw); aspect-ratio: 1; margin: 0 auto; border-radius: 22.4%; overflow: hidden; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
.pv-big svg { width: 100%; height: 100%; display: block; }
.home { border-radius: 20px; padding: 18px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
.home.light { background: linear-gradient(160deg, #A9C9E8, #E9C6D8); }
.home.dark { background: linear-gradient(160deg, #1B2540, #3A2347); }
.app { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .68rem; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / .5); }
.app .s { width: 100%; max-width: 58px; aspect-ratio: 1; border-radius: 22.4%; overflow: hidden; }
.app .s svg { width: 100%; height: 100%; display: block; }
.app .ph { width: 100%; max-width: 58px; aspect-ratio: 1; border-radius: 22.4%; background: rgb(255 255 255 / .35); }
.homes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .homes { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <h1>App-Symbol für Tierton</h1>
  <p class="lead">Tippe auf ein Symbol, um es groß und auf dem Homescreen zu sehen. Mit dem Herz markierst du, was dir gefällt. Die Favoriten sind gespeichert, Claude liest sie danach aus.</p>
  <div class="filters" id="filters"></div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
  <div class="notes">
    <label for="note">Notiz an Claude (optional)</label>
    <textarea id="note" placeholder="z. B. „Nr. 24 gefällt mir, aber in Blau“"></textarea>
  </div>
</div>

<dialog id="dlg">
  <div class="pv">
    <div class="pv-top"><h2 id="pv-title"></h2><button class="close" id="pv-close">Schließen</button></div>
    <div class="pv-big" id="pv-big"></div>
    <div class="homes">
      <div class="home light" id="home-l"></div>
      <div class="home dark" id="home-d"></div>
    </div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let SIZES = {};
let likes = {};       // n -> true
let db = null;

/* ---------- drawing helpers (all icons are 100×100) ---------- */
const lg = (id, a, b, angle = 90) => {
  const r = angle * Math.PI / 180, x2 = 50 + 50 * Math.cos(r), y2 = 50 + 50 * Math.sin(r);
  return `<linearGradient id="${id}" x1="${100 - x2}%" y1="${100 - y2}%" x2="${x2}%" y2="${y2}%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
};
const bg = (k, a, b) => `<defs>${lg(k + "g", a, b)}</defs><rect width="100" height="100" fill="url(#${k}g)"/>`;
const solid = (c) => `<rect width="100" height="100" fill="${c}"/>`;

/* place a cut-out photo: width w (or height h), centred at cx, bottom at by */
function photo(k, id, { w, h, cx = 50, by = 92, x, y, clip } = {}) {
  const s = SIZES[id]; if (!s) return "";
  const ar = s[0] / s[1];
  if (w == null) w = h * ar; if (h == null) h = w / ar;
  if (x == null) x = cx - w / 2; if (y == null) y = by - h;
  const cp = clip ? ` clip-path="url(#${k}c)"` : "";
  return `<image href="img/${id}.png" x="${x}" y="${y}" width="${w}" height="${h}"${cp} preserveAspectRatio="xMidYMid meet"/>`;
}
/* the app's pop-out: circle + everything above its centre line */
const popClip = (k, cx, cy, r) => `<defs><clipPath id="${k}c"><circle cx="${cx}" cy="${cy}" r="${r}"/><rect x="0" y="0" width="100" height="${cy}"/></clipPath></defs>`;
const waves = (x, y, dir = 1, col = "#fff", n = 3, step = 7, r0 = 6) => {
  let p = "";
  for (let i = 0; i < n; i++) {
    const r = r0 + i * step, a = 0.95 - i * 0.25;
    p += `<path d="M${x} ${y - r} A${r} ${r} 0 0 ${dir > 0 ? 1 : 0} ${x} ${y + r}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round" opacity="${a}"/>`;
  }
  return p;
};
const paw = (cx, cy, s, col) => `
  <ellipse cx="${cx}" cy="${cy + 3 * s}" rx="${7 * s}" ry="${5.8 * s}" fill="${col}"/>
  <ellipse cx="${cx - 7.2 * s}" cy="${cy - 3.2 * s}" rx="${2.6 * s}" ry="${3.3 * s}" fill="${col}" transform="rotate(-18 ${cx - 7.2 * s} ${cy - 3.2 * s})"/>
  <ellipse cx="${cx - 2.6 * s}" cy="${cy - 6.6 * s}" rx="${2.6 * s}" ry="${3.4 * s}" fill="${col}"/>
  <ellipse cx="${cx + 2.6 * s}" cy="${cy - 6.6 * s}" rx="${2.6 * s}" ry="${3.4 * s}" fill="${col}"/>
  <ellipse cx="${cx + 7.2 * s}" cy="${cy - 3.2 * s}" rx="${2.6 * s}" ry="${3.3 * s}" fill="${col}" transform="rotate(18 ${cx + 7.2 * s} ${cy - 3.2 * s})"/>`;
const note = (x, y, s, col) => `<g fill="${col}"><ellipse cx="${x}" cy="${y}" rx="${3.2 * s}" ry="${2.4 * s}" transform="rotate(-20 ${x} ${y})"/><rect x="${x + 2.4 * s}" y="${y - 11 * s}" width="${1.2 * s}" height="${11 * s}"/><path d="M${x + 2.4 * s} ${y - 11 * s} q${5 * s} ${2 * s} ${4 * s} ${6 * s} q${-0.5 * s} ${-3 * s} ${-4 * s} ${-3 * s}z"/></g>`;

/* ---------- calling animal heads (front view, open mouth, centred at 50/52 in a 100 box) ---------- */
const HEADS = {
  goat: `
    <path d="M41 30 Q37 15 27 10" fill="none" stroke="#8C7A5B" stroke-width="6" stroke-linecap="round"/>
    <path d="M59 30 Q63 15 73 10" fill="none" stroke="#8C7A5B" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="25" cy="40" rx="11" ry="5" fill="#E6D9BE" transform="rotate(20 25 40)"/>
    <ellipse cx="75" cy="40" rx="11" ry="5" fill="#E6D9BE" transform="rotate(-20 75 40)"/>
    <path d="M34 32 Q50 20 66 32 Q70 52 62 70 Q56 81 50 81 Q44 81 38 70 Q30 52 34 32Z" fill="#F6F0E2"/>
    <path d="M46 80 L50 94 L54 80Z" fill="#E6D9BE"/>
    <ellipse cx="42" cy="44" rx="5" ry="4.4" fill="#F2C14E"/><rect x="38.6" y="43" width="6.8" height="2.2" rx="1.1" fill="#1d1d1d"/>
    <ellipse cx="58" cy="44" rx="5" ry="4.4" fill="#F2C14E"/><rect x="54.6" y="43" width="6.8" height="2.2" rx="1.1" fill="#1d1d1d"/>
    <circle cx="46.5" cy="62" r="1.4" fill="#7A6A55"/><circle cx="53.5" cy="62" r="1.4" fill="#7A6A55"/>
    <ellipse cx="50" cy="71" rx="7" ry="6.2" fill="#5A2A2A"/><ellipse cx="50" cy="74.5" rx="4.2" ry="2.4" fill="#E97A8A"/>`,
  monkey: `
    <circle cx="20" cy="50" r="10" fill="#5A3A22"/><circle cx="20" cy="50" r="5.5" fill="#E3BD92"/>
    <circle cx="80" cy="50" r="10" fill="#5A3A22"/><circle cx="80" cy="50" r="5.5" fill="#E3BD92"/>
    <circle cx="50" cy="50" r="31" fill="#5A3A22"/>
    <circle cx="41" cy="45" r="12" fill="#E9C9A3"/><circle cx="59" cy="45" r="12" fill="#E9C9A3"/>
    <ellipse cx="50" cy="63" rx="17" ry="15" fill="#E9C9A3"/>
    <circle cx="42" cy="45" r="3.2" fill="#2A1A0E"/><circle cx="58" cy="45" r="3.2" fill="#2A1A0E"/>
    <circle cx="43" cy="44" r="1" fill="#fff"/><circle cx="59" cy="44" r="1" fill="#fff"/>
    <ellipse cx="47" cy="55" rx="1.6" ry="1.2" fill="#7A4E2E"/><ellipse cx="53" cy="55" rx="1.6" ry="1.2" fill="#7A4E2E"/>
    <ellipse cx="50" cy="67" rx="6.5" ry="7.5" fill="#4A1E1E"/><ellipse cx="50" cy="71" rx="3.6" ry="2.4" fill="#E97A8A"/>`,
  lion: (() => {
    let tufts = "";
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; tufts += `<circle cx="${(50 + Math.cos(a) * 26).toFixed(1)}" cy="${(52 + Math.sin(a) * 26).toFixed(1)}" r="9" fill="#C4561D"/>`; }
    return tufts + `<circle cx="50" cy="52" r="26" fill="#C4561D"/>
      <circle cx="33" cy="34" r="6" fill="#F2B95C"/><circle cx="67" cy="34" r="6" fill="#F2B95C"/>
      <circle cx="50" cy="54" r="21" fill="#F9D27E"/>
      <circle cx="42" cy="48" r="2.8" fill="#3A2412"/><circle cx="58" cy="48" r="2.8" fill="#3A2412"/>
      <path d="M45 55 h10 l-5 5z" fill="#7A3E1A"/>
      <ellipse cx="50" cy="67" rx="8" ry="6.5" fill="#5A1E14"/><ellipse cx="50" cy="70" rx="4.5" ry="2.4" fill="#E97A8A"/>
      <path d="M44.5 63 l1.5 3 1.5 -3z M52.5 63 l1.5 3 1.5 -3z" fill="#fff"/>`;
  })(),
  chick: `
    <path d="M48 22 q2 -8 6 -6 q-1 4 -4 7z" fill="#E8A52A"/>
    <circle cx="50" cy="52" r="28" fill="#F8CF4A"/>
    <ellipse cx="24" cy="60" rx="7" ry="12" fill="#EDB935" transform="rotate(20 24 60)"/>
    <ellipse cx="76" cy="60" rx="7" ry="12" fill="#EDB935" transform="rotate(-20 76 60)"/>
    <circle cx="40" cy="44" r="3.6" fill="#1d1d1d"/><circle cx="60" cy="44" r="3.6" fill="#1d1d1d"/>
    <circle cx="41" cy="43" r="1.1" fill="#fff"/><circle cx="61" cy="43" r="1.1" fill="#fff"/>
    <path d="M50 48 L62 58 L50 74 L38 58Z" fill="#F08A24"/>
    <ellipse cx="50" cy="60" rx="5" ry="6.5" fill="#5A1E14"/>`,
  frog: `
    <circle cx="34" cy="36" r="11" fill="#6DBE45"/><circle cx="66" cy="36" r="11" fill="#6DBE45"/>
    <ellipse cx="50" cy="58" rx="32" ry="24" fill="#6DBE45"/>
    <circle cx="34" cy="35" r="7" fill="#fff"/><circle cx="66" cy="35" r="7" fill="#fff"/>
    <circle cx="35" cy="36" r="3.6" fill="#1d1d1d"/><circle cx="65" cy="36" r="3.6" fill="#1d1d1d"/>
    <circle cx="45" cy="50" r="1.3" fill="#2E6B1E"/><circle cx="55" cy="50" r="1.3" fill="#2E6B1E"/>
    <path d="M28 58 Q50 88 72 58 Q50 66 28 58Z" fill="#5A1E14"/>
    <ellipse cx="50" cy="72" rx="7" ry="3.6" fill="#E97A8A"/>`,
  cow: `
    <path d="M34 30 q-8 -6 -6 -14 q6 4 10 10z M66 30 q8 -6 6 -14 q-6 4 -10 10z" fill="#E8DCC4"/>
    <ellipse cx="24" cy="40" rx="11" ry="6" fill="#F2F2F2" transform="rotate(18 24 40)"/>
    <ellipse cx="76" cy="40" rx="11" ry="6" fill="#F2F2F2" transform="rotate(-18 76 40)"/>
    <rect x="31" y="24" width="38" height="58" rx="18" fill="#FAFAFA"/>
    <path d="M31 40 q8 -10 16 -2 q-2 10 -16 8z" fill="#2B2B2B"/><path d="M62 26 q8 4 7 14 q-8 -2 -9 -10z" fill="#2B2B2B"/>
    <circle cx="42" cy="46" r="3" fill="#1d1d1d"/><circle cx="58" cy="46" r="3" fill="#1d1d1d"/>
    <ellipse cx="50" cy="70" rx="18" ry="13" fill="#F2A9B5"/>
    <ellipse cx="43" cy="64" rx="2.4" ry="1.6" fill="#B5606E"/><ellipse cx="57" cy="64" rx="2.4" ry="1.6" fill="#B5606E"/>
    <ellipse cx="50" cy="74" rx="7" ry="5.5" fill="#5A1E14"/><ellipse cx="50" cy="76.5" rx="4" ry="2" fill="#E97A8A"/>`,
  penguin: `
    <circle cx="50" cy="52" r="29" fill="#1E2329"/>
    <circle cx="41" cy="54" r="15" fill="#fff"/><circle cx="59" cy="54" r="15" fill="#fff"/>
    <ellipse cx="50" cy="66" rx="18" ry="14" fill="#fff"/>
    <circle cx="42" cy="48" r="3.2" fill="#1d1d1d"/><circle cx="58" cy="48" r="3.2" fill="#1d1d1d"/>
    <path d="M50 52 L61 61 L50 74 L39 61Z" fill="#F2A33A"/>
    <ellipse cx="50" cy="62" rx="4.4" ry="6" fill="#5A1E14"/>`,
};
/* draw a head at (x,y), size s (1 = 100 units), rotated by deg */
const head = (name, x, y, s, deg = 0) => `<g transform="translate(${x} ${y}) rotate(${deg}) scale(${s}) translate(-50 -52)">${HEADS[name]}</g>`;

/* a bouquet of real cut-out animals radiating from the centre; each entry: id, width, radius, angle */
function photoBouquet(k, list, a, b) {
  let rays = "", imgs = "";
  for (let i = 0; i < 16; i++) { const t = i / 16 * Math.PI * 2; rays += `<path d="M50 50 L${(50 + Math.cos(t - 0.1) * 80).toFixed(1)} ${(50 + Math.sin(t - 0.1) * 80).toFixed(1)} L${(50 + Math.cos(t + 0.1) * 80).toFixed(1)} ${(50 + Math.sin(t + 0.1) * 80).toFixed(1)}Z" fill="#fff" opacity=".16"/>`; }
  list.forEach(e => {
    const s = SIZES[e.id]; if (!s) return;
    const w = e.w, h = w * s[1] / s[0], t = e.deg * Math.PI / 180;
    const x = 50 + Math.cos(t) * e.r, y = 50 + Math.sin(t) * e.r;
    const flip = e.flip ? " scale(-1 1)" : "";
    imgs += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${e.rot ?? 0})${flip}"><image href="img/${e.id}.png" x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}"/></g>`;
  });
  return `<defs><radialGradient id="${k}r"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs><rect width="100" height="100" fill="url(#${k}r)"/>` + rays + imgs;
}

/* yellow sound rings: a dot and three concentric circles */
const rings = (cx, cy, r0 = 7, step = 9, col = "#FFC94A") =>
  `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="${col}"/>` +
  [1, 2, 3].map(i => `<circle cx="${cx}" cy="${cy}" r="${r0 + i * step}" fill="none" stroke="${col}" stroke-width="3.6" opacity="${(1 - i * 0.22).toFixed(2)}"/>`).join("");
const green = (k) => bg(k, "#47AE74", "#1C6A42");

/* ---------- the ideas ---------- */
const DIRS = { neu: "Neu: Klangkreise", foto: "Foto-Tier", ruf: "Rufendes Tier", t: "Buchstabe T", grafik: "Grafisch" };
const ICONS = [
  // Foto-Tiere im App-Stil
  { n: 1, d: "foto", t: "Löwe im Kreis", svg: k => bg(k, "#FCDB8C", "#E89A47") + `<circle cx="50" cy="54" r="34" fill="#FFF6E0" opacity=".8"/>` + photo(k, "loewe", { w: 66, by: 84 }) },
  { n: 2, d: "foto", t: "Löwenkopf, ganz nah", svg: k => bg(k, "#F3B55E", "#D9822F") + photo(k, "loewe", { w: 150, x: -1, y: -4 }) },
  { n: 3, d: "foto", t: "Schimpanse lugt hervor", svg: k => bg(k, "#79B77F", "#2E7D4F") + photo(k, "schimpanse", { w: 84, x: 8, y: 22 }) },
  { n: 4, d: "foto", t: "Pinguin-Familie", svg: k => bg(k, "#E2F2FA", "#93C2E0") + popClip(k, 50, 58, 34) + `<circle cx="50" cy="58" r="34" fill="#fff" opacity=".55"/>` + photo(k, "kaiserpinguin", { h: 84, by: 88, clip: 1 }) },
  { n: 5, d: "foto", t: "Kauz bei Nacht", svg: k => solid("#1E2846") + `<circle cx="50" cy="44" r="31" fill="#F4D35E"/>` + photo(k, "waldkauz", { h: 80, by: 98 }) },
  { n: 6, d: "foto", t: "Papageitaucher", svg: k => bg(k, "#4E9BCB", "#1C4F73") + popClip(k, 50, 58, 34) + `<circle cx="50" cy="58" r="34" fill="#fff" opacity=".22"/>` + photo(k, "papageitaucher", { h: 80, by: 90, clip: 1 }) },
  { n: 7, d: "foto", t: "Rotkehlchen singt", svg: k => bg(k, "#F1F6EC", "#CFE3C4") + photo(k, "rotkehlchen", { w: 70, x: 2, y: 34 }) + waves(70, 44, 1, "#E07A27", 3, 7, 5) },

      });
      return solid("#F6B545") + bars + `<circle cx="50" cy="52" r="21" fill="#F9D27E"/>
        <circle cx="43" cy="48" r="2.4" fill="#3A2412"/><circle cx="57" cy="48" r="2.4" fill="#3A2412"/>
        <path d="M46 55 h8 l-4 5z" fill="#7A3E1A"/><path d="M50 60 q-4 5 -8 3 M50 60 q4 5 8 3" fill="none" stroke="#7A3E1A" stroke-width="1.8" stroke-linecap="round"/>`;
    } },
];

/* calling-animal photos get added here once found (see extra.json) */
async function loadExtra() {
  try {
    const extra = await (await fetch("extra.json")).json();
    extra.forEach(e => {
      Object.assign(SIZES, { [e.id]: e.size });
      const k = e.kind;
      let svg;
      if (k === "ziege") svg = kk => bg(kk, "#C7E59B", "#6FA84A") + photo(kk, e.id, { w: e.size[0] >= e.size[1] ? 92 : undefined, h: e.size[0] < e.size[1] ? 88 : undefined, cx: 46, by: 104 }) + `<path d="M62 12 h28 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-14 l-8 7 v-7 h-6 a8 8 0 0 1 -8 -8 v-12 a8 8 0 0 1 8 -8z" fill="#fff"/><text x="76" y="31" text-anchor="middle" font-family="Fredoka, ui-rounded, sans-serif" font-weight="700" font-size="12" fill="#3B6E22">Mäh!</text>`;
      else if (k === "wolf") svg = kk => bg(kk, "#2A3A63", "#141C33") + `<circle cx="70" cy="28" r="18" fill="#F3EFD9"/>` + photo(kk, e.id, { h: 86, cx: 44, by: 102 });
      else if (k === "hahn") svg = kk => bg(kk, "#FFE08A", "#F29E38") + `<circle cx="50" cy="58" r="34" fill="#fff" opacity=".4"/>` + photo(kk, e.id, { h: 84, cx: 46, by: 94 }) + waves(84, 26, 1, "#C2410C", 3, 6, 4);
      else if (k === "vogel") svg = kk => bg(kk, "#EAF5E3", "#BFDDB0") + photo(kk, e.id, { w: 76, cx: 44, by: 94 }) + note(80, 26, 1, "#2E6B3D") + note(88, 40, 0.75, "#2E6B3D");
      else if (k === "affe") svg = kk => bg(kk, "#3FA36A", "#1F6E45") + photo(kk, e.id, { w: 94, cx: 50, by: 100 });
      else svg = kk => bg(kk, "#F3B55E", "#C9692A") + photo(kk, e.id, { w: 96, cx: 50, by: 100 }) + waves(88, 40, 1, "#fff", 3, 6, 4);
      ICONS.push({ n: e.n, d: "ruf", t: e.title, svg });
    });
    ICONS.sort((a, b) => a.n - b.n);
  } catch (err) { /* no extra photos yet */ }
}

const svgOf = (ic, key) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${ic.t}">${ic.svg("i" + key)}</svg>`;
const heartSvg = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;

let filter = "alle";
function renderFilters() {
  const opts = [["alle", "Alle"], ["fav", "Favoriten"], ...Object.entries(DIRS)];
  $("filters").innerHTML = opts.map(([k, v]) => `<button class="f" data-f="${k}" aria-pressed="${filter === k}">${v}</button>`).join("");
  $("filters").querySelectorAll(".f").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; renderFilters(); renderGrid(); }));
}
function renderGrid() {
  const list = ICONS.filter(ic => filter === "alle" || (filter === "fav" ? likes[ic.n] : ic.d === filter));
  $("grid").innerHTML = list.length ? list.map(ic => `
    <div class="card">
      <button class="ico" data-n="${ic.n}" aria-label="${ic.t} groß ansehen">${svgOf(ic, "g" + ic.n)}</button>
      <div class="meta">
        <div><b>${ic.n} · ${ic.t}</b><small>${DIRS[ic.d]}</small></div>
        <button class="heart" data-n="${ic.n}" aria-pressed="${!!likes[ic.n]}" aria-label="${ic.t} als Favorit markieren">${heartSvg}</button>
      </div>
    </div>`).join("") : `<p class="lead">Noch keine Favoriten. Tippe auf ein Herz.</p>`;
  $("grid").querySelectorAll(".heart").forEach(b => b.addEventListener("click", () => toggle(+b.dataset.n)));
  $("grid").querySelectorAll(".ico").forEach(b => b.addEventListener("click", () => preview(+b.dataset.n)));
  $("status").textContent = `${ICONS.length} Vorschläge · ${Object.values(likes).filter(Boolean).length} Favoriten`;
}

async function toggle(n) {
  likes[n] = !likes[n];
  renderGrid();
  if (db) {
    try { await db.collection("likes").doc(String(n)).set({ liked: likes[n], at: Date.now() }); }
    catch (e) { $("status").textContent = "Speichern hat nicht geklappt. Versuch es gleich nochmal."; }
  } else {
    try { localStorage.setItem("tierton-icon-likes", JSON.stringify(likes)); } catch (e) {}
  }
}

function preview(n) {
  const ic = ICONS.find(i => i.n === n);
  $("pv-title").textContent = `${ic.n} · ${ic.t}`;
  $("pv-big").innerHTML = svgOf(ic, "p" + n);
  const others = ["Fotos", "Karten", "Musik", "Uhr", "Wetter", "Notizen", "Kamera"];
  const grid = (key) => others.slice(0, 3).map(o => `<div class="app"><div class="ph"></div>${o}</div>`).join("")
    + `<div class="app"><div class="s">${svgOf(ic, key + n)}</div>Tierton</div>`
    + others.slice(3, 7).map(o => `<div class="app"><div class="ph"></div>${o}</div>`).join("");
  $("home-l").innerHTML = grid("hl");
  $("home-d").innerHTML = grid("hd");
  $("dlg").showModal();
}
$("pv-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

let noteTimer;
$("note").addEventListener("input", () => {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(async () => {
    if (db) { try { await db.collection("notes").doc("general").set({ text: $("note").value.slice(0, 2000), at: Date.now() }); } catch (e) {} }
    else { try { localStorage.setItem("tierton-icon-note", $("note").value); } catch (e) {} }
  }, 800);
});

async function boot() {
  try { SIZES = await (await fetch("sizes.json")).json(); } catch (e) {}
  await loadExtra();
  renderFilters(); renderGrid();
  db = await (window.claude?.use ? window.claude.use("db") : Promise.resolve(null));
  if (!db) {
    try { likes = JSON.parse(localStorage.getItem("tierton-icon-likes") || "{}"); $("note").value = localStorage.getItem("tierton-icon-note") || ""; } catch (e) {}
    $("status").textContent += " · nur auf diesem Gerät gespeichert";
    renderGrid();
    return;
  }
  db.collection("likes").onSnapshot((snap) => {
    const l = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.liked) l[d.id] = true; });
    likes = l; renderGrid();
  }, () => {});
  try {
    const n = await db.collection("notes").doc("general").get();
    if (n.exists && document.activeElement !== $("note")) $("note").value = n.data().text || "";
  } catch (e) {}
}
boot();
</script>
